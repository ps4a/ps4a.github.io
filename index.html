<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>بلاي ستور المشتل · PS4A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<!-- إصلاح متغير msgs لتجنب خطأ السكربتات -->
<script>
    var msgs = { innerHTML: "" };
    window.msgs = msgs;
</script>

<style>
:root{
  --bg: #050810;
  --surface: #0a1120;
  --border: #1a2a45;
  --pink: #ff007f;
  --cyan: #00d4ff;
  --gold: #ffcc00;
  --text: #ffffff;
  --muted: #8fa0b5;
  --success: #00ff9d;
  --danger: #ff3d71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(255,204,0,0.05) 0%, transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(255,0,127,0.05) 0%, transparent 50%);
}
.wrap { width: 100%; max-width: 500px; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }

/* الشعار */
.logo-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; margin-top: 10px; }
.neon-ring {
  width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--gold);
  position: relative; display: flex; justify-content: center; align-items: center;
  box-shadow: 0 0 15px rgba(255, 204, 0, 0.4), inset 0 0 15px rgba(255, 204, 0, 0.4);
  background: radial-gradient(circle, #0a1525 40%, var(--bg) 100%);
}
.neon-ring::before {
  content: ''; position: absolute; inset: 6px; border-radius: 50%;
  border: 2px solid var(--pink); border-left-color: var(--cyan); border-bottom-color: var(--cyan);
  animation: spin 10s linear infinite; box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
}
.controller-svg {
  width: 70px; height: 70px; fill: none; stroke: var(--text); stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.8)); z-index: 2;
}
.logo-text { margin-top: 12px; text-align: center; line-height: 1.2; }
.logo-text .line1 { font-size: 26px; font-weight: 900; color: var(--pink); text-shadow: 0 0 8px rgba(255,0,127,0.6), 2px 2px 0 var(--gold); }
.logo-text .line2 { font-size: 32px; font-weight: 900; color: var(--pink); text-shadow: 0 0 8px rgba(255,0,127,0.6), 2px 2px 0 var(--gold); }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* البطاقات */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.card::before { content: ''; position: absolute; top: -1px; left: 20px; right: 20px; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent); border-radius: 2px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.card-title::before { content: ''; width: 6px; height: 6px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 8px var(--cyan); }
.info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.info-row:last-child { border-bottom: none; padding-bottom: 0; }
.info-row:first-of-type { padding-top: 0; }
.info-label { font-size: 15px; color: var(--muted); font-weight: 700; }
.info-value { font-size: 15px; font-weight: 700; color: var(--text); background: rgba(0, 212, 255, 0.1); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(0, 212, 255, 0.2); direction: ltr; }
.info-value.fw { color: var(--gold); background: rgba(255, 204, 0, 0.1); border-color: rgba(255, 204, 0, 0.3); }

/* زر التشغيل */
.btn {
  width: 100%; padding: 16px; border: none; border-radius: 12px; font-family: 'Tajawal', sans-serif;
  font-size: 18px; font-weight: 900; color: #000; cursor: pointer;
  background: linear-gradient(45deg, var(--gold), #ffdd55); box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
  transition: all 0.2s ease; position: relative; overflow: hidden;
}
.btn:disabled { background: var(--surface); color: var(--muted); border: 1px solid var(--border); box-shadow: none; cursor: not-allowed; }
.btn.success { background: var(--success); color: #000 !important; text-shadow: none; box-shadow: 0 0 20px var(--success); }

/* شبكة الإحصائيات */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
.mini-card .num { font-size: 20px; font-weight: 800; color: var(--pink); text-shadow: 0 0 8px rgba(255,0,127,0.3); direction: ltr; }
.mini-card .lbl { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; }

/* التذييل */
.footer { text-align: center; font-size: 14px; color: var(--text); padding: 20px 0; line-height: 1.9; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.footer .dev-box { color: var(--gold); font-weight: 700; font-size: 15px; }
.footer .contact { font-weight: 700; }
.footer .contact a { color: var(--cyan); text-decoration: none; direction: ltr; display: inline-block; }
.footer .location { color: var(--muted); font-size: 13px; }
.footer .rights { display: block; font-size: 12px; color: #4a5a75; margin-top: 8px; }

/* التوست */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--surface); border: 1px solid var(--pink); color: white; padding: 10px 20px; border-radius: 8px;
  font-size: 14px; font-weight: bold; opacity: 0; transition: 0.3s; z-index: 99; box-shadow: 0 0 15px rgba(255,0,127,0.4);
  width: max-content; max-width: 90%; text-align: center; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="wrap">
  <header class="logo-container">
    <div class="neon-ring">
      <svg class="controller-svg" viewBox="0 0 24 24">
        <path d="M6 10h4M8 8v4M15 9h.01M18 11h.01M17.32 5H6.68a4 4 0 0 0-3.97 3.53l-1 8.47A3 3 0 0 0 4.66 20a3 3 0 0 0 2.83-2l.53-1.6a2 2 0 0 1 1.9-1.4h4.16a2 2 0 0 1 1.9 1.4l.53 1.6a3 3 0 0 0 2.83 2 3 3 0 0 0 2.95-3l-1-8.47A4 4 0 0 0 17.32 5z"/>
      </svg>
    </div>
    <div class="logo-text">
      <div class="line1">بلاي ستور</div>
      <div class="line2">المشتل</div>
    </div>
  </header>

  <section class="card">
    <div class="card-title">حالة النظام</div>
    <div class="info-row">
      <span class="info-label">الجهاز</span>
      <span class="info-value" id="deviceName">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">إصدار النظام</span>
      <span class="info-value fw" id="fwVersion">جارٍ الفحص…</span>
    </div>
    <div class="info-row">
      <span class="info-label">حالة الكاش</span>
      <span class="info-value" id="cacheState">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">الحمولة</span>
      <span class="info-value" id="payloadName">—</span>
    </div>
  </section>

  <button class="btn" id="bootBtn" disabled>جارٍ اكتشاف النظام…</button>

  <div class="grid">
    <div class="mini-card">
      <div class="num" id="visitCount">—</div>
      <div class="lbl">الزيارات</div>
    </div>
    <div class="mini-card">
      <div class="num" id="hostStatus">—</div>
      <div class="lbl">الاتصال</div>
    </div>
  </div>

  <footer class="footer">
    <div class="dev-box">تصميم وتطوير : ( بلاي ستور المشتل )</div>
    <div class="contact">تواصل : <a href="tel:07749932347">07749932347</a></div>
    <div class="location">موقعنا : بغداد / المشتل / شارع الكوسترات</div>
    <span class="rights">جميع الحقوق محفوظة &copy; 2026</span>
  </footer>
</div>

<div id="msgs" style="display:none; visibility:hidden;">Running...</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);
  const ui = {
    device: $('deviceName'), fw: $('fwVersion'), cache: $('cacheState'),
    payload: $('payloadName'), bootBtn: $('bootBtn'), visits: $('visitCount'),
    host: $('hostStatus'), toast: $('toast')
  };

  function showToast(msg, isError){
    ui.toast.textContent = msg;
    ui.toast.style.borderColor = isError ? 'var(--danger)' : 'var(--cyan)';
    ui.toast.className = 'toast show';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => ui.toast.className = 'toast', 3500);
  }

  function initVisits(){
    const KEY = 'aliosama_visits_v50';
    let local = parseInt(localStorage.getItem(KEY) || '0', 10) + 1;
    localStorage.setItem(KEY, local);
    ui.visits.textContent = local;
  }

  function initHostStatus(){
    ui.host.textContent = navigator.onLine ? 'متصل' : 'أوفلاين';
    window.addEventListener('online', () => ui.host.textContent = 'متصل');
    window.addEventListener('offline', () => ui.host.textContent = 'أوفلاين');
  }

  function detectFirmware(ua){
    const patterns = [/PlayStation 4\/([\d.]+)/i, /Mozilla\/5\.0 \(PlayStation 4 ([\d.]+)\)/i];
    for (const p of patterns){
      const m = ua.match(p);
      if (m) return m[1];
    }
    return null;
  }

  // دالة تحديد المسارات بناءً على الإصدار
  function resolvePayload(fw){
    if (!fw) return null;
    const v = parseFloat(fw);
    if (v >= 5.05 && v <= 5.07) return { path:'505/exploit.js', cache:'505.manifest' };
    if (v >= 7.00 && v <= 8.52) return { path:'700/alert.js', cache:'700.manifest' };
    if (v >= 9.00 && v <= 9.60) return { path:'900/alert.js', cache:'900.manifest' };
    if (v >= 10.00 && v <= 11.02) return { path:'css/main.js', cache:'css.manifest' };
    // إصدار 12.50 يستخدم مجلد 12
    if (v >= 11.50 && v <= 13.52) return { path:'12/jb.js', cache:'12/slopkit.manifest' };
    return null;
  }

  function loadPayload(path){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = path;
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('فشل تحميل: ' + path));
      document.body.appendChild(s);
    });
  }

  async function initSystemHost(){
    const ua = navigator.userAgent;
    const isPS4 = /PlayStation 4/i.test(ua);
    ui.device.textContent = isPS4 ? 'PlayStation 4' : 'متصفح آخر';
    const fw = detectFirmware(ua);

    if (!fw){
      ui.fw.textContent = 'غير معروف';
      ui.bootBtn.textContent = 'افتح من متصفح PS4';
      return;
    }

    ui.fw.textContent = fw;
    const payload = resolvePayload(fw);
    
    if (!payload){
      ui.payload.textContent = 'غير مدعوم';
      ui.bootBtn.textContent = 'إصدار غير مدعوم';
      return;
    }

    ui.payload.textContent = payload.path;
    ui.bootBtn.disabled = false;
    
    // فحص حالة الكاش
    const hasCache = !!(window.applicationCache && window.applicationCache.status !== 0);
    ui.cache.textContent = hasCache ? 'مخزّن' : 'غير مخزّن';

    if (!hasCache) {
      // المرحلة الأولى: تثبيت الكاش
      ui.bootBtn.textContent = 'تثبيت الكاش (اضغط هنا)';
      ui.bootBtn.onclick = function() {
        ui.bootBtn.disabled = true;
        ui.bootBtn.textContent = 'جارٍ تثبيت الكاش...';
        showToast('جاري التحويل لصفحة الكاش...');
        // التوجيه إلى صفحة الكاش الخاصة بمجلد 12
        window.location.href = '12/cacheslopkit.html';
      };
    } else {
      // المرحلة الثانية: تشغيل الهاك
      ui.bootBtn.textContent = 'تشغيل الحمولة (اضغط هنا)';
      ui.bootBtn.onclick = async function() {
        ui.bootBtn.disabled = true;
        ui.bootBtn.textContent = 'جارٍ التنفيذ… (الرجاء الانتظار)';
        
        try {
          await loadPayload(payload.path);
          ui.bootBtn.className = 'btn success';
          ui.bootBtn.textContent = 'تم التشغيل بنجاح ✓';
          showToast('تم تحميل الحمولة بنجاح');
        } catch(err) {
          ui.bootBtn.disabled = false;
          ui.bootBtn.textContent = 'فشل التحميل - إعادة المحاولة';
          showToast('فشل التحميل، حاول مرة أخرى', true);
        }
      };
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initVisits();
    initHostStatus();
    initSystemHost();
  });
})();
</script>
</body>
</html>

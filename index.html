<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>بلاي ستور المشتل · PS4A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #050810;
  --surface: #0a1120;
  --border: #1a2a45;
  --pink: #ff007f;
  --cyan: #00d4ff;
  --gold: #ffcc00;
  --text: #ffffff;
  --muted: #8fa0b5;
  --success: #00ff9d;
  --danger: #ff3d71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(255,204,0,0.05) 0%, transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(255,0,127,0.05) 0%, transparent 50%);
}
.wrap { width: 100%; max-width: 500px; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }

/* الشعار */
.logo-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; margin-top: 10px; }
.neon-ring {
  width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--gold);
  position: relative; display: flex; justify-content: center; align-items: center;
  box-shadow: 0 0 15px rgba(255, 204, 0, 0.4), inset 0 0 15px rgba(255, 204, 0, 0.4);
  background: radial-gradient(circle, #0a1525 40%, var(--bg) 100%);
}
.neon-ring::before {
  content: ''; position: absolute; inset: 6px; border-radius: 50%;
  border: 2px solid var(--pink); border-left-color: var(--cyan); border-bottom-color: var(--cyan);
  animation: spin 10s linear infinite; box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
}
.controller-svg {
  width: 70px; height: 70px; fill: none; stroke: var(--text); stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.8)); z-index: 2;
}
.logo-text { margin-top: 12px; text-align: center; line-height: 1.2; }
.logo-text .line1 { font-size: 26px; font-weight: 900; color: var(--pink); text-shadow: 0 0 8px rgba(255,0,127,0.6), 2px 2px 0 var(--gold); }
.logo-text .line2 { font-size: 32px; font-weight: 900; color: var(--pink); text-shadow: 0 0 8px rgba(255,0,127,0.6), 2px 2px 0 var(--gold); }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* البطاقات */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.card::before { content: ''; position: absolute; top: -1px; left: 20px; right: 20px; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent); border-radius: 2px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.card-title::before { content: ''; width: 6px; height: 6px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 8px var(--cyan); }
.info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.info-row:last-child { border-bottom: none; padding-bottom: 0; }
.info-row:first-of-type { padding-top: 0; }
.info-label { font-size: 15px; color: var(--muted); font-weight: 700; }
.info-value { font-size: 15px; font-weight: 700; color: var(--text); background: rgba(0, 212, 255, 0.1); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(0, 212, 255, 0.2); direction: ltr; }
.info-value.fw { color: var(--gold); background: rgba(255, 204, 0, 0.1); border-color: rgba(255, 204, 0, 0.3); }

/* الزر الكبير (يعمل كشاشة عرض حالة) */
.btn {
  width: 100%; padding: 18px 16px; border: none; border-radius: 12px; font-family: 'Tajawal', sans-serif;
  font-size: 18px; font-weight: 900; color: #000;
  background: linear-gradient(45deg, var(--gold), #ffdd55); box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
  text-align: center; transition: all 0.3s ease; position: relative; overflow: hidden;
  display: block; pointer-events: none; /* لمنع الضغط عليه */
}
.btn.success { background: linear-gradient(45deg, var(--success), #00cc7a); color: #000; box-shadow: 0 0 30px var(--success); }
.btn.error { background: linear-gradient(45deg, var(--danger), #cc0033); color: #fff; box-shadow: 0 0 30px var(--danger); }
.btn.loading { background: linear-gradient(45deg, var(--cyan), #0070d1); color: #fff; box-shadow: 0 0 30px var(--cyan); animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

/* شبكة الإحصائيات */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
.mini-card .num { font-size: 20px; font-weight: 800; color: var(--pink); text-shadow: 0 0 8px rgba(255,0,127,0.3); direction: ltr; }
.mini-card .lbl { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; }

/* التذييل */
.footer { text-align: center; font-size: 14px; color: var(--text); padding: 20px 0; line-height: 1.9; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.footer .dev-box { color: var(--gold); font-weight: 700; font-size: 15px; }
.footer .contact { font-weight: 700; }
.footer .contact a { color: var(--cyan); text-decoration: none; direction: ltr; display: inline-block; }
.footer .location { color: var(--muted); font-size: 13px; }
.footer .rights { display: block; font-size: 12px; color: #4a5a75; margin-top: 8px; }
</style>
</head>
<body>

<div class="wrap">
  <!-- الشعار -->
  <header class="logo-container">
    <div class="neon-ring">
      <svg class="controller-svg" viewBox="0 0 24 24">
        <path d="M6 10h4M8 8v4M15 9h.01M18 11h.01M17.32 5H6.68a4 4 0 0 0-3.97 3.53l-1 8.47A3 3 0 0 0 4.66 20a3 3 0 0 0 2.83-2l.53-1.6a2 2 0 0 1 1.9-1.4h4.16a2 2 0 0 1 1.9 1.4l.53 1.6a3 3 0 0 0 2.83 2 3 3 0 0 0 2.95-3l-1-8.47A4 4 0 0 0 17.32 5z"/>
      </svg>
    </div>
    <div class="logo-text">
      <div class="line1">بلاي ستور</div>
      <div class="line2">المشتل</div>
    </div>
  </header>

  <!-- بطاقة النظام -->
  <section class="card">
    <div class="card-title">حالة النظام</div>
    <div class="info-row">
      <span class="info-label">الجهاز</span>
      <span class="info-value" id="deviceName">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">إصدار النظام</span>
      <span class="info-value fw" id="fwVersion">جارٍ الفحص…</span>
    </div>
  </section>

  <!-- الزر الكبير (يعرض الحالة تلقائياً) -->
  <div class="btn loading" id="bootBtn">جارٍ اكتشاف النظام...</div>

  <!-- شبكة الإحصائيات -->
  <div class="grid">
    <div class="mini-card">
      <div class="num" id="visitCount">—</div>
      <div class="lbl">الزيارات</div>
    </div>
    <div class="mini-card">
      <div class="num" id="hostStatus">—</div>
      <div class="lbl">الاتصال</div>
    </div>
  </div>

  <!-- التذييل -->
  <footer class="footer">
    <div class="dev-box">تصميم وتطوير : ( بلاي ستور المشتل )</div>
    <div class="contact">تواصل : <a href="tel:07749932347">07749932347</a></div>
    <div class="location">موقعنا : بغداد / المشتل / شارع الكوسترات</div>
    <span class="rights">جميع الحقوق محفوظة &copy; 2026</span>
  </footer>
</div>

<!-- عنصر مخفي ليتوافق مع السكربت الأصلي -->
<div id="msgs" style="display:none;"></div>

<script>
// ==========================================
// 🔴 منطق p.github.io الأصلي 100%
// ==========================================
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

// ربط عناصر التصميم
var bootBtn = document.getElementById('bootBtn');
var deviceEl = document.getElementById('deviceName');
var fwEl = document.getElementById('fwVersion');
var hostEl = document.getElementById('hostStatus');

// تحديث واجهة المستخدم
deviceEl.textContent = isPS4 ? 'PlayStation 4' : 'متصفح آخر';
fwEl.textContent = isPS4 ? fwVersion : 'غير معروف';
hostEl.textContent = navigator.onLine ? 'متصل' : 'أوفلاين';

// عداد الزيارات
var visitKey = 'aliosama_visits_v50';
var localVisits = parseInt(localStorage.getItem(visitKey) || '0', 10) + 1;
localStorage.setItem(visitKey, localVisits);
document.getElementById('visitCount').textContent = localVisits;

function onScriptError() {
    bootBtn.className = 'btn error';
    bootBtn.innerHTML = "المحتوى غير موجود! امسح بيانات المتصفح وأعد المحاولة...";
}

// المنطق الأساسي
if (!isPS4) {
    bootBtn.className = 'btn error';
    bootBtn.innerHTML = "هذا الموقع مخصص لأجهزة PS4 فقط";
} else {
    if (window.applicationCache.status == '0') {
        // التوجيه التلقائي لصفحة الكاش
        bootBtn.innerHTML = "جاري تحضير الكاش...";
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            bootBtn.className = 'btn error';
            bootBtn.innerHTML = 'إصدار غير مدعوم: ' + fwVersion;
        }
    } else {
        // الكاش جاهز، تحميل السكربت المناسب تلقائياً
        bootBtn.innerHTML = "جارٍ تحميل GoldHEN... الرجاء الانتظار";
        
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            script.onload = function() { bootBtn.className = 'btn success'; bootBtn.innerHTML = "تم التشغيل بنجاح ✓"; };
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            script.onload = function() { bootBtn.className = 'btn success'; bootBtn.innerHTML = "تم التشغيل بنجاح ✓"; };
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            script.onload = function() { bootBtn.className = 'btn success'; bootBtn.innerHTML = "تم التشغيل بنجاح ✓"; };
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function() {
                setTimeout(function() { 
                    if(typeof doJb === "function") doJb(); 
                    bootBtn.className = 'btn success'; 
                    bootBtn.innerHTML = "تم التشغيل بنجاح ✓";
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            script.onload = function() { bootBtn.className = 'btn success'; bootBtn.innerHTML = "تم التشغيل بنجاح ✓"; };
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            script.onload = function() { bootBtn.className = 'btn success'; bootBtn.innerHTML = "تم التشغيل بنجاح ✓"; };
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=10";
            script.onerror = onScriptError;
            script.onload = function() { bootBtn.className = 'btn success'; bootBtn.innerHTML = "تم التشغيل بنجاح ✓"; };
            document.head.appendChild(script);
        }
    }
}
</script>
</body>
</html>

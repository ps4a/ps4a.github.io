<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="slopkit.manifest">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>بلاي ستور المشتل / تثبيت ذاكرة التخزين المؤقت</title>
    
    <!-- استدعاء الخط العربي (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050810;
            --surface: #0a1120;
            --border: #1a2a45;
            --pink: #ff007f;
            --cyan: #00d4ff;
            --gold: #ffcc00;
            --text: #ffffff;
            --muted: #8fa0b5;
            --danger: #ff3d71;
            --success: #00ff9d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255,204,0,0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(255,0,127,0.05) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        .hud-container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        /* الخط العلوي الملون */
        .hud-container::before {
            content: '';
            position: absolute;
            top: -1px; left: 30px; right: 30px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
            border-radius: 2px;
        }

        /* ═══ الشعار المصنوع بـ CSS ═══ */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .neon-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4), inset 0 0 15px rgba(255, 204, 0, 0.4);
            background: radial-gradient(circle, #0a1525 40%, var(--bg) 100%);
            margin-bottom: 15px;
        }

        .neon-ring::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            border: 2px solid var(--pink);
            border-left-color: var(--cyan);
            border-bottom-color: var(--cyan);
            animation: spin 10s linear infinite;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .controller-svg {
            width: 55px;
            height: 55px;
            fill: none;
            stroke: var(--text);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.8));
            z-index: 2;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* العناوين */
        .main-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--pink);
            text-shadow: 0 0 8px rgba(255,0,127,0.6), 2px 2px 0 var(--gold);
            margin-bottom: 5px;
        }

        .sub-tagline {
            font-size: 14px;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 20px;
            direction: ltr; /* للحفاظ على الأرقام بالترتيب الصحيح */
        }

        /* شريط التقدم */
        .progress-box {
            width: 100%;
            background: #050810;
            border: 1px solid var(--border);
            border-radius: 50px;
            height: 14px;
            margin: 0 auto 20px auto;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            padding: 2px;
            position: relative;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), var(--pink));
            border-radius: 50px;
            box-shadow: 0 0 12px var(--pink);
            transition: width 0.25s ease-out;
        }

        /* صندوق الرسائل */
        .action-dock {
            margin-bottom: 25px;
        }

        #msgs {
            width: 100%;
            padding: 18px 15px;
            font-size: 18px;
            font-weight: 700;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            color: var(--text);
            position: relative;
            display: block;
            line-height: 1.4;
        }

        /* التذييل */
        .hud-footer {
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            line-height: 1.8;
        }

        .hud-footer .dev-box { color: var(--gold); font-weight: 700; font-size: 14px; }
        .hud-footer .contact { font-weight: 700; }
        .hud-footer .contact a { color: var(--cyan); text-decoration: none; direction: ltr; display: inline-block; }
        .hud-footer .location { color: var(--muted); font-size: 12px; }
        .hud-footer .rights { display: block; font-size: 11px; color: #4a5a75; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="hud-container">
        
        <!-- الشعار الجديد -->
        <div class="logo-container">
            <div class="neon-ring">
                <svg class="controller-svg" viewBox="0 0 24 24">
                    <path d="M6 10h4M8 8v4M15 9h.01M18 11h.01M17.32 5H6.68a4 4 0 0 0-3.97 3.53l-1 8.47A3 3 0 0 0 4.66 20a3 3 0 0 0 2.83-2l.53-1.6a2 2 0 0 1 1.9-1.4h4.16a2 2 0 0 1 1.9 1.4l.53 1.6a3 3 0 0 0 2.83 2 3 3 0 0 0 2.95-3l-1-8.47A4 4 0 0 0 17.32 5z"/>
                </svg>
            </div>
            <h1 class="main-title">بلاي ستور المشتل</h1>
            <p class="sub-tagline">تثبيت ملفات التشغيل دون إنترنت (11.50 - 13.52)</p>
        </div>

        <!-- شريط النيون لنسبة التنزيل -->
        <div class="progress-box">
            <div id="progress-fill"></div>
        </div>

        <!-- صندوق عرض الحالة والرسائل الأساسي -->
        <div class="action-dock">
            <h1 id="msgs">جارٍ بدء تثبيت ذاكرة التخزين المؤقت...</h1>
        </div>

        <!-- الحقوق والبيانات الجديدة -->
        <footer class="hud-footer">
            <div class="dev-box">تصميم وتطوير : ( بلاي ستور المشتل )</div>
            <div class="contact">تواصل : <a href="tel:07733340622">07733340622</a></div>
            <div class="location">موقعنا : بغداد / المشتل / شارع الكوسترات</div>
            <span class="rights">جميع الحقوق محفوظة &copy; 2026</span>
        </footer>

    </div>

<script>
var pFill = document.getElementById("progress-fill");
var msgs = document.getElementById("msgs");

function DLProgress(e) {
    if (e.total) {
        var Percent = Math.round((e.loaded / e.total) * 100);
        msgs.innerHTML = "جارٍ حفظ الملفات للاستخدام دون إنترنت: " + Percent + "%";
        if (pFill) pFill.style.width = Percent + "%";
    }
}

function DisplayCacheProgress() {
    msgs.innerHTML = "تم حفظ التخزين المؤقت بنجاح! يتم التحويل الآن... ✔";
    if (pFill) pFill.style.width = "100%";
    setTimeout(function() {
        window.location.replace("index.html");
    }, 1500);
}

window.applicationCache.addEventListener("progress", DLProgress, false);
window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
window.applicationCache.onnoupdate = function(e) {
    window.location.replace("index.html");
};
window.applicationCache.onerror = function(e) {
    msgs.innerHTML = "حدث خطأ أثناء تثبيت الكاش! - امسح بيانات المتصفح وأعد المحاولة...";
};
</script>
</body>
</html>

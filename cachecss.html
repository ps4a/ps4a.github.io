<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="css.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>بلاي ستور المشتل / تثبيت الكاش</title>

<!-- استدعاء الخط العربي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #050810;
  --surface: #0a1120;
  --border: #1a2a45;
  --pink: #ff007f;
  --cyan: #00d4ff;
  --gold: #ffcc00;
  --text: #ffffff;
  --muted: #8fa0b5;
  --success: #00ff9d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 16px;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(255,204,0,0.05) 0%, transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(255,0,127,0.05) 0%, transparent 50%);
}

/* بطاقة التثبيت */
.card { 
  width: 100%; 
  max-width: 500px; 
  background: var(--surface); 
  border: 1px solid var(--border); 
  border-radius: 16px; 
  padding: 30px 20px; 
  position: relative; 
  box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
  text-align: center;
}
.card::before { 
  content: ''; 
  position: absolute; 
  top: -1px; left: 30px; right: 30px; 
  height: 2px; 
  background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent); 
  border-radius: 2px; 
}

/* الشعار */
.logo-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
.neon-ring {
  width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--gold);
  position: relative; display: flex; justify-content: center; align-items: center;
  box-shadow: 0 0 15px rgba(255, 204, 0, 0.4), inset 0 0 15px rgba(255, 204, 0, 0.4);
  background: radial-gradient(circle, #0a1525 40%, var(--bg) 100%);
  margin-bottom: 15px;
}
.neon-ring::before {
  content: ''; position: absolute; inset: 6px; border-radius: 50%;
  border: 2px solid var(--pink); border-left-color: var(--cyan); border-bottom-color: var(--cyan);
  animation: spin 10s linear infinite; box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
}
.controller-svg {
  width: 55px; height: 55px; fill: none; stroke: var(--text); stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.8)); z-index: 2;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

/* العناوين */
.main-title {
  font-size: 26px; font-weight: 900; color: var(--pink);
  text-shadow: 0 0 8px rgba(255,0,127,0.6), 2px 2px 0 var(--gold); margin-bottom: 5px;
}
.sub-tagline { font-size: 14px; color: var(--muted); font-weight: 700; margin-bottom: 25px; direction: ltr; }

/* صندوق عرض الرسائل */
#msgs {
  width: 100%; padding: 20px 15px; font-size: 18px; font-weight: 700;
  background: rgba(0, 212, 255, 0.05); border-radius: 10px;
  border: 1px solid rgba(0, 212, 255, 0.2); color: var(--text);
  text-align: center; line-height: 1.4; min-height: 70px;
  display: flex; justify-content: center; align-items: center;
}

/* التذييل */
.footer { 
  text-align: center; font-size: 13px; color: var(--text); 
  padding-top: 20px; margin-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.08); 
  display: flex; flex-direction: column; gap: 6px;
}
.footer .dev-box { color: var(--gold); font-weight: 700; font-size: 14px; }
.footer .contact { font-weight: 700; }
.footer .contact a { color: var(--cyan); text-decoration: none; direction: ltr; display: inline-block; }
.footer .location { color: var(--muted); font-size: 12px; }
.footer .rights { display: block; font-size: 11px; color: #4a5a75; margin-top: 5px; }
</style>
</head>
<body>

<div class="card">
  <!-- الشعار -->
  <div class="logo-container">
    <div class="neon-ring">
      <svg class="controller-svg" viewBox="0 0 24 24">
        <path d="M6 10h4M8 8v4M15 9h.01M18 11h.01M17.32 5H6.68a4 4 0 0 0-3.97 3.53l-1 8.47A3 3 0 0 0 4.66 20a3 3 0 0 0 2.83-2l.53-1.6a2 2 0 0 1 1.9-1.4h4.16a2 2 0 0 1 1.9 1.4l.53 1.6a3 3 0 0 0 2.83 2 3 3 0 0 0 2.95-3l-1-8.47A4 4 0 0 0 17.32 5z"/>
      </svg>
    </div>
    <h1 class="main-title">بلاي ستور المشتل</h1>
    <p class="sub-tagline">تثبيت ملفات التشغيل دون إنترنت (10.00 - 11.02)</p>
  </div>

  <!-- صندوق الحالة (مرتبط بكود الجافاسكربت) -->
  <div id="msgs">جارٍ بدء تثبيت الكاش...</div>

  <!-- التذييل -->
  <footer class="footer">
    <div class="dev-box">تصميم وتطوير : ( بلاي ستور المشتل )</div>
    <div class="contact">تواصل : <a href="tel:07749932347">07749932347</a></div>
    <div class="location">موقعنا : بغداد / المشتل / شارع الكوسترات</div>
    <span class="rights">جميع الحقوق محفوظة &copy; 2026</span>
  </footer>
</div>

<!-- 🔴 الكود الأصلي 100% -->
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){
    if(e.total){
        var Percent=(Math.round(e.loaded / e.total * 100));
        window.msgs.innerHTML="جارٍ حفظ الملفات للأوفلاين: " + Percent + "%";
    }
}
function DisplayCacheProgress(){
    window.msgs.innerHTML="تم تثبيت الكاش بنجاح ✔";
    setTimeout(function(){window.msgs.innerHTML="الآن أغلق المتصفح وأعد فتحه...";},1500);
}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="حدث خطأ أثناء تثبيت الكاش! امسح بيانات المتصفح وأعد المحاولة...";};
</script>
</body>
</html>
